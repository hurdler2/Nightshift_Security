name: nightshift
description: Nightshift Security — construction site security console (Android + iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking / models
  dio: ^5.5.0
  web_socket_channel: ^3.0.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Storage & security — tokens go in the platform keychain, never shared prefs.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Push (spec §20)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Media (spec §23, §41)
  video_player: ^2.9.1
  cached_network_image: ^3.3.1

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
