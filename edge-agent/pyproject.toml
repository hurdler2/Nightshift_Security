[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift-edge"
version = "0.1.0"
description = "Nightshift Security Edge Agent — Dahua XVR integration and cloud bridge"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42.0",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.8",
]

[project.scripts]
nightshift-edge = "nightshift_edge.main:main"
nightshift-dahua-probe = "nightshift_edge.cli.probe_cli:main"

[tool.setuptools.packages.find]
include = ["nightshift_edge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:nightshift_edge.*"]
